<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Verify Your Email — ResearchGate</title>
  <link rel="stylesheet" href="../../css/shared.css" />
  <link rel="stylesheet" href="auth.css" />
  <style>
    /* ---- Verify page layout ---- */
    .verify-wrapper {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
      min-height: calc(100vh - 58px);
    }

    .verify-card {
      background: #fff;
      border-radius: 20px;
      box-shadow: 0 4px 32px rgba(108,71,255,0.10);
      padding: 48px 44px;
      width: 100%;
      max-width: 460px;
      text-align: center;
    }

    .verify-icon {
      width: 72px;
      height: 72px;
      background: #f0ebff;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 24px;
    }

    .verify-card h2 {
      font-size: 1.5rem;
      font-weight: 800;
      color: #1a1a2e;
      margin-bottom: 8px;
    }

    .verify-card .verify-sub {
      font-size: 0.9rem;
      color: #6b7280;
      line-height: 1.5;
      margin-bottom: 8px;
    }

    .verify-email-display {
      font-size: 0.88rem;
      font-weight: 600;
      color: #6c47ff;
      margin-bottom: 32px;
    }

    /* 6 individual digit boxes */
    .code-boxes {
      display: flex;
      gap: 10px;
      justify-content: center;
      margin-bottom: 28px;
    }

    .code-box {
      width: 52px;
      height: 60px;
      border: 2px solid #e5e7eb;
      border-radius: 10px;
      font-size: 1.6rem;
      font-weight: 700;
      text-align: center;
      color: #1a1a2e;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
      caret-color: #6c47ff;
      background: #fafafa;
    }

    .code-box:focus {
      border-color: #6c47ff;
      box-shadow: 0 0 0 3px rgba(108,71,255,0.12);
      background: #fff;
    }

    .code-box.filled {
      border-color: #6c47ff;
      background: #f5f4ff;
    }

    .code-box.error-box {
      border-color: #ef4444;
      background: #fef2f2;
      animation: shake 0.35s ease;
    }

    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      25%       { transform: translateX(-6px); }
      75%       { transform: translateX(6px); }
    }

    .verify-error {
      color: #ef4444;
      font-size: 0.85rem;
      margin-bottom: 16px;
      min-height: 20px;
      display: none;
    }

    .verify-success {
      color: #22c55e;
      font-size: 0.9rem;
      font-weight: 600;
      display: none;
    }

    .btn-verify {
      width: 100%;
      padding: 14px;
      background: #6c47ff;
      color: #fff;
      border: none;
      border-radius: 10px;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      transition: background 0.2s, opacity 0.2s;
      margin-bottom: 20px;
    }

    .btn-verify:hover { background: #5535e0; }
    .btn-verify:disabled { opacity: 0.6; cursor: default; }

    .resend-row {
      font-size: 0.85rem;
      color: #6b7280;
    }

    .resend-row button {
      background: none;
      border: none;
      color: #6c47ff;
      font-weight: 600;
      cursor: pointer;
      font-size: 0.85rem;
      padding: 0;
      transition: opacity 0.2s;
    }

    .resend-row button:disabled {
      opacity: 0.4;
      cursor: default;
    }

    .resend-timer {
      color: #9ca3af;
      font-size: 0.82rem;
      margin-top: 6px;
      display: none;
    }

    @media (max-width: 520px) {
      .verify-card { padding: 32px 20px; }
      .code-box { width: 42px; height: 52px; font-size: 1.3rem; }
    }
  </style>
</head>
<body>

  <div id="navbar-root"></div>

  <div class="verify-wrapper">
    <div class="verify-card">

      <!-- Email icon -->
      <div class="verify-icon">
        <svg width="36" height="36" viewBox="0 0 36 36" fill="none">
          <rect x="4" y="8" width="28" height="20" rx="4" stroke="#6c47ff" stroke-width="2.2" fill="none"/>
          <path d="M4 12l14 9 14-9" stroke="#6c47ff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </div>

      <h2>Check Your Email</h2>
      <p class="verify-sub">We sent a 6-digit verification code to</p>
      <div class="verify-email-display" id="display-email">your email address</div>

      <!-- 6 digit boxes -->
      <div class="code-boxes" id="code-boxes">
        <input class="code-box" type="text" inputmode="numeric" maxlength="1" />
        <input class="code-box" type="text" inputmode="numeric" maxlength="1" />
        <input class="code-box" type="text" inputmode="numeric" maxlength="1" />
        <input class="code-box" type="text" inputmode="numeric" maxlength="1" />
        <input class="code-box" type="text" inputmode="numeric" maxlength="1" />
        <input class="code-box" type="text" inputmode="numeric" maxlength="1" />
      </div>

      <p class="verify-error" id="verify-error"></p>
      <p class="verify-success" id="verify-success">Email verified! Signing you in...</p>

      <button class="btn-verify" id="verify-btn" onclick="submitCode()">Verify Email</button>

      <div class="resend-row">
        Didn't receive it?&nbsp;
        <button id="resend-btn" onclick="resendCode()">Resend code</button>
      </div>
      <div class="resend-timer" id="resend-timer"></div>

    </div>
  </div>

  <div id="footer-root"></div>

  <script>
    const pending = JSON.parse(localStorage.getItem('rg_pending_user') || '{}');
    if (!pending.userId) {
      // No pending verification — redirect to login
      window.location.href = 'login.html';
    }

    document.getElementById('display-email').textContent = pending.email || 'your email address';

    // --- Code box keyboard navigation ---
    const boxes = Array.from(document.querySelectorAll('.code-box'));

    boxes.forEach((box, i) => {
      box.addEventListener('input', (e) => {
        const val = e.target.value.replace(/\D/g, '');
        e.target.value = val ? val[val.length - 1] : '';
        e.target.classList.toggle('filled', !!e.target.value);
        if (e.target.value && i < boxes.length - 1) boxes[i + 1].focus();
        if (getCode().length === 6) submitCode();
      });

      box.addEventListener('keydown', (e) => {
        if (e.key === 'Backspace' && !box.value && i > 0) {
          boxes[i - 1].value = '';
          boxes[i - 1].classList.remove('filled');
          boxes[i - 1].focus();
        }
        if (e.key === 'ArrowLeft'  && i > 0)              boxes[i - 1].focus();
        if (e.key === 'ArrowRight' && i < boxes.length-1) boxes[i + 1].focus();
      });

      // Allow paste into first box to fill all 6
      box.addEventListener('paste', (e) => {
        e.preventDefault();
        const pasted = (e.clipboardData.getData('text') || '').replace(/\D/g, '').slice(0, 6);
        pasted.split('').forEach((char, idx) => {
          if (boxes[idx]) {
            boxes[idx].value = char;
            boxes[idx].classList.add('filled');
          }
        });
        const next = Math.min(pasted.length, boxes.length - 1);
        boxes[next].focus();
        if (pasted.length === 6) setTimeout(submitCode, 100);
      });
    });

    boxes[0].focus();

    function getCode() { return boxes.map(b => b.value).join(''); }

    function showError(msg) {
      const el = document.getElementById('verify-error');
      el.textContent = msg;
      el.style.display = 'block';
      // Shake all boxes
      boxes.forEach(b => { b.classList.add('error-box'); setTimeout(() => b.classList.remove('error-box'), 400); });
    }

    function clearError() {
      const el = document.getElementById('verify-error');
      el.style.display = 'none';
      el.textContent = '';
    }

    async function submitCode() {
      const code = getCode();
      if (code.length !== 6) { showError('Please enter all 6 digits.'); return; }

      clearError();
      const btn = document.getElementById('verify-btn');
      btn.disabled = true;
      btn.textContent = 'Verifying...';

      try {
        const res  = await fetch('/api/auth/verify-code', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ userId: pending.userId, code })
        });
        const data = await res.json();

        if (!res.ok) {
          showError(data.error || 'Verification failed.');
          btn.disabled = false;
          btn.textContent = 'Verify Email';
          return;
        }

        // Success!
        localStorage.setItem('rg_token', data.token);
        localStorage.setItem('rg_user',  JSON.stringify(data.user));
        localStorage.removeItem('rg_pending_user');

        document.getElementById('verify-success').style.display = 'block';
        btn.style.display = 'none';
        setTimeout(() => { window.location.href = '../dashboard/dashboard.html'; }, 1200);

      } catch (err) {
        showError('Network error. Please try again.');
        btn.disabled = false;
        btn.textContent = 'Verify Email';
      }
    }

    // --- Resend with 60s cooldown ---
    let resendCooldown = 0;
    let resendInterval = null;

    async function resendCode() {
      if (resendCooldown > 0) return;

      const resendBtn   = document.getElementById('resend-btn');
      const timerEl     = document.getElementById('resend-timer');
      resendBtn.disabled = true;
      resendCooldown = 60;

      timerEl.textContent = 'Resend available in 60s';
      timerEl.style.display = 'block';

      resendInterval = setInterval(() => {
        resendCooldown--;
        timerEl.textContent = `Resend available in ${resendCooldown}s`;
        if (resendCooldown <= 0) {
          clearInterval(resendInterval);
          timerEl.style.display = 'none';
          resendBtn.disabled = false;
        }
      }, 1000);

      try {
        const res  = await fetch('/api/auth/resend-code', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ userId: pending.userId })
        });
        const data = await res.json();
        if (!res.ok) {
          showError(data.error || 'Could not resend code.');
        } else {
          clearError();
          boxes.forEach(b => { b.value = ''; b.classList.remove('filled'); });
          boxes[0].focus();
        }
      } catch {
        showError('Network error. Please try again.');
      }
    }
  </script>
  <script src="../../js/shared-layout.js" defer></script>
</body>
</html>
